name: CI

# The contrast floor, the derived-token rule, keyboard focus, reduced motion,
# and core.version agreement all live in `npm run check`. Without this workflow
# they were enforced only by whoever remembered to run it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install and build (npm ci runs the prepare build)
        run: npm ci
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
      - name: Pack
        run: npm run pack:check

      # The preview is the only consumer that exercises the published portal and
      # the Starlight integration end to end. Its own workflow runs on pushes to
      # main, which is too late — a broken portal reference reached main and sat
      # there. Run it here so a pull request catches it.
      - name: Install preview
        run: npm install
        working-directory: preview
      - name: Test preview
        run: npm test
        working-directory: preview
