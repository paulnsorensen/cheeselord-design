name: Deploy preview

# No paths filter on purpose: the package (src/, assets/, schemas/, components/)
# feeds the preview via its file:.. dependency, so nearly any change affects the
# published output; an incomplete filter risks silently skipping deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            preview/package-lock.json
      - name: Install and build @cheeselord/design (npm ci runs the prepare build)
        run: npm ci
      - name: Install preview dependencies
        run: npm ci
        working-directory: preview
      - name: Test preview
        run: npm test
        working-directory: preview
      - name: Build preview site
        run: npm run build
        working-directory: preview
        env:
          PREVIEW_BASE_PREFIX: /cheeselord-design
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: preview/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0